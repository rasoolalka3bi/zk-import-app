plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.chaquo.python'
}

android {
    namespace 'com.zkimport.app'
    compileSdk 34

    defaultConfig {
        // معرّف مختلف عن التطبيق الأصلي حتى يُثبّت الاثنان على نفس الهاتف
        applicationId "com.zkimport.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a"
        }

        python {
            pip {
                install "flask"
                install "pyzk"
                // بلا openpyxl: لا وجود للإكسل في هذا التطبيق
            }
        }
    }

    signingConfigs {
        release {
            // مفاتيح التوقيع تأتي من أسرار GitHub، ولا تُحفظ داخل الكود أبدًا.
            // بلا هذه القيم يُبنى التطبيق بلا توقيع (نسخة تجريبية فقط).
            def storeFileName = System.getenv("KEYSTORE_FILE")
            if (storeFileName) {
                storeFile file(storeFileName)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv("KEYSTORE_FILE")) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
}
