name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # الأسرار تُنقل إلى متغيّرات بيئة أولًا، لأن شرط if لا يقرأ الأسرار مباشرة
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Python (needed by Chaquopy at build time)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Gradle (pinned version - avoids wrapper-generation issues)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.4

      # مفتاح التوقيع محفوظ في أسرار المستودع بصيغة base64. نفس المفتاح في كل
      # بناء يعني أن التحديثات تُثبَّت فوق النسخة القديمة بدون حذف التطبيق.
      - name: Restore signing keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        if: env.KEYSTORE_BASE64 != ''
        run: gradle assembleRelease --stacktrace

      # بلا مفتاح، نسخة release تخرج بلا توقيع ولا يمكن تثبيتها إطلاقًا،
      # لذلك نبني نسخة تجريبية بدلًا منها حتى لا يخرج البناء بملف عديم الفائدة
      - name: Build debug APK (no signing key configured)
        if: env.KEYSTORE_BASE64 == ''
        run: gradle assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZKImportApp-apk
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
